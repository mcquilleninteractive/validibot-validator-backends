# Release exactly one validator backend from a backend-specific signed tag.
#
# A tag such as ``energyplus-v0.17.0`` is accepted only when the EnergyPlus
# entry in ``backends.toml`` is release-enabled and its ``release_version`` is
# exactly ``0.17.0``. The selected image is built once, by digest, and the
# workflow publishes its SBOM plus one attested backend release JSON record.
#
# Trust boundary: release tags are verified against ``.allowed_signers`` loaded
# from protected ``main``, never from the tag being verified. The tag commit
# must also be the checked-out commit and an ancestor of protected ``main``.
# Manual dispatch retries an existing unpublished tag without deleting, moving,
# or recreating it and passes through the same identity checks as a tag push.

name: Release validator backend image
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed unpublished backend release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  select-release:
    name: Verify backend release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.inventory.outputs.backend }}
      version: ${{ steps.inventory.outputs.version }}
      source_tag: ${{ steps.inventory.outputs.source_tag }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      dockerfile: ${{ steps.inventory.outputs.dockerfile }}
      requirements: ${{ steps.inventory.outputs.requirements }}
      requirements_lock: ${{ steps.inventory.outputs.requirements_lock }}
      application_sbom: ${{ steps.inventory.outputs.application_sbom }}
      test_path: ${{ steps.inventory.outputs.test_path }}
      image_name: ${{ steps.inventory.outputs.image_name }}
      shared_contract: ${{ steps.inventory.outputs.shared_contract }}
      platform: ${{ steps.inventory.outputs.platform }}
      sbom: ${{ steps.inventory.outputs.sbom }}
      release_record: ${{ steps.inventory.outputs.release_record }}

    steps:
      - name: Checkout full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag against protected-main trust anchor
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:.allowed_signers \
            > "$RUNNER_TEMP/validibot-allowed-signers"
          test -s "$RUNNER_TEMP/validibot-allowed-signers" || {
            echo "::error::Protected main is missing .allowed_signers."
            exit 1
          }
          git config gpg.ssh.allowedSignersFile \
            "$RUNNER_TEMP/validibot-allowed-signers"
          git config gpg.format ssh

          if [[ "$RELEASE_TAG" == -* ]] || \
              ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Invalid release tag name."
            exit 1
          fi
          if ! git verify-tag -- "$RELEASE_TAG"; then
            echo "::error::Tag '$RELEASE_TAG' is not signed by an allowed key."
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          CHECKOUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TAG_COMMIT" != "$CHECKOUT_COMMIT" ]]; then
            echo "::error::Tag commit does not match the checked-out commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag commit is not on protected main."
            exit 1
          fi
          echo "source_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate inventory and select one backend
        id: inventory
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/backend_inventory.py validate >/dev/null
          python3 scripts/backend_inventory.py release "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"

  test-selected-backend:
    name: Test ${{ needs.select-release.outputs.backend }}
    needs: select-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.select-release.outputs.source_tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"

      - name: Install selected backend dependencies
        env:
          BACKEND: ${{ needs.select-release.outputs.backend }}
        run: |
          uv python install 3.13
          uv sync --frozen --extra dev --extra "$BACKEND"

      - name: Verify locked dependencies, application SBOM, and license policy
        env:
          BACKEND: ${{ needs.select-release.outputs.backend }}
        run: |
          uv run python scripts/backend_artifacts.py check --backend "$BACKEND"
          uv run python scripts/generate_legal_artifacts.py \
            --policy legal/license-policy.toml \
            --check-only

      - name: Run inventory, shared-core, and selected backend tests
        env:
          TEST_PATH: ${{ needs.select-release.outputs.test_path }}
        run: |
          uv run pytest tests validator_backends/core/tests "$TEST_PATH"

  build-and-publish:
    name: Publish ${{ needs.select-release.outputs.backend }} v${{ needs.select-release.outputs.version }}
    needs: [select-release, test-selected-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ghcr
    permissions:
      id-token: write
      attestations: write
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.select-release.outputs.source_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image references
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ needs.select-release.outputs.image_name }}
          VERSION: ${{ needs.select-release.outputs.version }}
        run: |
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          {
            echo "name=$IMAGE"
            echo "version_tag=v${VERSION}"
            echo "version_ref=${IMAGE}:v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.select-release.outputs.source_tag }}
          VERSION_REF: ${{ steps.image.outputs.version_ref }}
        run: |
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$RELEASE_TAG' already exists."
            exit 1
          fi
          if docker buildx imagetools inspect "$VERSION_REF" \
            >/dev/null 2>&1; then
            echo "::error::Container tag '$VERSION_REF' already exists."
            exit 1
          fi

      - name: Build and push selected image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ needs.select-release.outputs.dockerfile }}
          platforms: ${{ needs.select-release.outputs.platform }}
          push: true
          tags: |
            ${{ steps.image.outputs.version_ref }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VALIDATOR_BACKEND_VERSION=${{ needs.select-release.outputs.version }}
            VALIDATOR_BACKEND_REVISION=${{ needs.select-release.outputs.source_commit }}
            VALIDATOR_BACKEND_SOURCE=https://github.com/${{ github.repository }}
            VALIDATOR_BACKEND_SLUG=${{ needs.select-release.outputs.backend }}
          provenance: mode=max
          sbom: true

      - name: Attest exact image digest
        id: image-attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate standalone SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ needs.select-release.outputs.sbom }}
          upload-artifact: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ needs.select-release.outputs.sbom }}
          push-to-registry: true

      - name: Attest application dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ needs.select-release.outputs.application_sbom }}
          push-to-registry: true

      - name: Generate backend release JSON
        env:
          BACKEND: ${{ needs.select-release.outputs.backend }}
          VERSION: ${{ needs.select-release.outputs.version }}
          SOURCE_TAG: ${{ needs.select-release.outputs.source_tag }}
          SOURCE_COMMIT: ${{ needs.select-release.outputs.source_commit }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SHARED_CONTRACT: ${{ needs.select-release.outputs.shared_contract }}
          SBOM: ${{ needs.select-release.outputs.sbom }}
          BUILD_VERIFICATION: ${{ steps.image-attestation.outputs.attestation-url }}
          RELEASE_RECORD: ${{ needs.select-release.outputs.release_record }}
        run: |
          jq -n \
            --arg schema_version "validibot.backend-release.v1" \
            --arg backend "$BACKEND" \
            --arg version "$VERSION" \
            --arg source_tag "$SOURCE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg image "$IMAGE" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg shared_contract "$SHARED_CONTRACT" \
            --arg sbom "$SBOM" \
            --arg build_verification "$BUILD_VERIFICATION" \
            '{
              schema_version: $schema_version,
              backend: $backend,
              version: $version,
              source_tag: $source_tag,
              source_commit: $source_commit,
              image: $image,
              image_digest: $image_digest,
              shared_contract: $shared_contract,
              sbom: $sbom,
              build_verification: $build_verification
            }' > "$RELEASE_RECORD"
          sha256sum "$RELEASE_RECORD" > "${RELEASE_RECORD}.sha256"

      - name: Attest backend release JSON
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ needs.select-release.outputs.release_record }}

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.select-release.outputs.source_tag }}
          path: |
            ${{ needs.select-release.outputs.sbom }}
            ${{ needs.select-release.outputs.application_sbom }}
            ${{ needs.select-release.outputs.release_record }}
            ${{ needs.select-release.outputs.release_record }}.sha256
          retention-days: 90

      - name: Create backend-specific GitHub Release
        env:
          RELEASE_TAG: ${{ needs.select-release.outputs.source_tag }}
          SBOM: ${{ needs.select-release.outputs.sbom }}
          APPLICATION_SBOM: ${{ needs.select-release.outputs.application_sbom }}
          RELEASE_RECORD: ${{ needs.select-release.outputs.release_record }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$SBOM" \
            "$APPLICATION_SBOM" \
            "$RELEASE_RECORD" \
            "${RELEASE_RECORD}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
