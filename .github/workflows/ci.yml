name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.5.1
      - name: Detect private keys
        run: pre-commit run detect-private-key --all-files
      - name: Scan tracked files with TruffleHog
        run: pre-commit run trufflehog --all-files

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras installs the per-validator groups (shacl, fmu, ...) that
        # pytest's testpaths collect; without them those modules fail to import.
        # --frozen guarantees CI tests the exact registry artifacts recorded in
        # the committed lockfile, matching the released container requirements.
        run: uv sync --all-extras --frozen

      - name: Audit dependencies
        run: |
          for requirements in validator_backends/*/requirements.lock; do
            uvx --from pip-audit==2.10.1 pip-audit \
              --require-hashes \
              --disable-pip \
              --requirement "$requirements"
          done

      - name: Lint
        run: uv run --frozen --all-extras ruff check .

      - name: Check formatting
        run: uv run --frozen --all-extras ruff format --check .

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --frozen --all-extras pytest

  ci:
    name: ci
    if: always()
    needs: [security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$SECURITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
