# ==== Project metadata ====

[project]
name = "validibot-validator-backends"
version = "0.16.4"
description = "Validibot advanced validator containers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Daniel McQuillen", email = "daniel@validibot.com" },
    { name = "McQuillen Interactive Pty. Ltd." },
]
keywords = [
    "validibot",
    "validation",
    "energyplus",
    "fmi",
    "fmu",
    "shacl",
    "rdf",
    "simulation",
    "building-energy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

# Core dependencies shared by all validators
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "google-cloud-storage==3.13.1",
    "google-auth==2.57.1",
    "requests==2.34.2",
    "sentry-sdk==2.68.1",
    "validibot-shared==0.28.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.167.1",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

# EnergyPlus validator dependencies (for local dev/testing)
energyplus = [
    # EnergyPlus-specific deps go here
]

# FMU validator dependencies (for local dev/testing)
fmu = [
    "defusedxml==0.7.1",
    "fmpy==0.3.31",
]

# SHACL validator dependencies (for local dev/testing). Pinned to match the
# community validibot repo so behaviour is identical across the boundary.
shacl = [
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "owlrl==7.6.2",
    "defusedxml==0.7.1",
    "lxml==6.1.3",
]

# Schematron validator dependencies (for local dev/testing). SaxonC-HE is
# the chosen XSLT 2.0 engine (ADR-2026-07-01 D4, MPL-2.0); defusedxml pins
# match the community repo's hardened-XML guard.
schematron = [
    "saxonche==13.0.0",
    "defusedxml==0.7.1",
]

portfolio_manager = [
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

# PDF package inventory and bounded embedded-member extraction. pikepdf exposes
# qpdf's structural parser without adding a renderer or script engine.
pdf = [
    "pikepdf==10.13.0.post1",
]

[dependency-groups]
# Scheduled coverage-guided PDF fuzzing is deliberately separate from the
# ordinary developer environment because Atheris carries a large libFuzzer
# runtime. The bounded CI workflow installs this group explicitly.
fuzz = [
    "atheris==3.1.0",
]

[project.urls]
Homepage = "https://validibot.com"
Documentation = "https://docs.validibot.com"
Repository = "https://github.com/mcquilleninteractive/validibot-validator-backends"
Issues = "https://github.com/mcquilleninteractive/validibot-validator-backends/issues"

# ==== Build system ====

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["validator_backends"]

# fastjsonschema 2.22.0 was yanked for invalid Python-version metadata.
# Keep FMPy's nbformat dependency on a non-yanked compatible release.
[tool.uv]
constraint-dependencies = ["fastjsonschema!=2.22.0"]

# ==== pytest ====

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "validator_backends/energyplus/tests",
    "validator_backends/core/tests",
    "validator_backends/fmu/tests",
    "validator_backends/shacl/tests",
    "validator_backends/schematron/tests",
    "validator_backends/portfolio_manager/tests",
    "validator_backends/pdf/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require Docker/containers)",
    "slow: Slow tests (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ==== Coverage ====

[tool.coverage.run]
source = ["validator_backends"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ==== Ruff ====

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["validator_backends"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "ARG001", # Unused function argument (common in interfaces)
    "ARG002", # Unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["validator_backends", "validibot_shared"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Unused arguments OK in tests (fixtures)
    "S101", # Assert OK in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ==== mypy ====

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
