test_path = "validator_backends/energyplus/tests"
image_name = "validibot-validator-backend-energyplus"
shared_contract = "0.27.0"
platforms = ["linux/amd64"]
execution_shapes = ["job", "service"]
service_runtime_contract = "validibot-execution-v1"
service_concurrency = 1
service_max_domain_seconds = 1500
release = true

